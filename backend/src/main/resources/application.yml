# Configuración común. Los datos de conexión están en application-dev.yml.
spring:
  application:
    name: aleyleo-api
  profiles:
    active: dev
  servlet:
    multipart:            # subida de imágenes (BE-12). El límite real de 5 MB lo revisa FileStorageService.
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: 8080

# JWT (BE-08). La clave es SOLO de desarrollo: en producción iría en una variable de entorno.
jwt:
  secreto: "aleyleo-clave-de-desarrollo-solo-para-la-E2-no-usar-en-produccion"
  expiracion-segundos: 86400   # 24 horas

# Carpeta donde se guardan las imágenes subidas (se sirve en /uploads/**).
almacenamiento:
  carpeta: uploads

# BE-05: carga los datos de prueba (sección 5.4) al arrancar, solo si la BD está vacía.
aleyleo:
  datos-prueba: true
